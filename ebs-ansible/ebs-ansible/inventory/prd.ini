# =========================
# PRD
# =========================
[prd_db]
dbprd1 ansible_user=oracle
dbprd ansible_user=oracle

[prd_app_admin]
apprd1 ansible_user=applusr ansible_python_interpreter=/usr/bin/python3.6

[prd_app_web_appl]
apprd2-applusr ansible_host=apprd2 ansible_user=applusr
apprd3-applusr ansible_host=apprd3 ansible_user=applusr
apprd4-applusr ansible_host=apprd4 ansible_user=applusr

[prd_app_web_wls]
apprd2-webusr ansible_host=apprd2 ansible_user=webusr
apprd3-webusr ansible_host=apprd3 ansible_user=webusr
apprd4-webusr ansible_host=apprd4 ansible_user=webusr

[prd_app_web:children]
prd_app_web_appl
prd_app_web_wls

[prd_app:children]
prd_app_admin
prd_app_web

[prd:children]
prd_db
prd_app

# =========================
# UAT
# =========================
[uat_db]
dbuat1 ansible_user=oracle
dbuat2 ansible_user=oracle

[uat_app_admin]
apuat1 ansible_user=applusr ansible_python_interpreter=/usr/bin/python3.6

[uat_app_web_appl]
apuat2-applusr ansible_host=apuat2 ansible_user=applusr
apuat3-applusr ansible_host=apuat3 ansible_user=applusr

[uat_app_web_wls]
apuat2-webusr ansible_host=apuat2 ansible_user=webusr
apuat3-webusr ansible_host=apuat3 ansible_user=webusr

[uat_app_web:children]
uat_app_web_appl
uat_app_web_wls

[uat_app:children]
uat_app_admin
uat_app_web

[uat:children]
uat_db
uat_app

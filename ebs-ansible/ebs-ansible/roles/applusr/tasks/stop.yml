# -------------------------------
# Stop EBS services (all app nodes)
# -------------------------------
- name: Stop EBS services
  shell: |
    . {{ env_file }}
    {{ app_stop_script }}
  register: app_out
  when: target_env + '_app_web_appl' in group_names

- debug:
    var: app_out.stdout


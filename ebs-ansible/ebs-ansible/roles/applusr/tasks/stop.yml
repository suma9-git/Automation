- name: Stop Admin Server
  ansible.builtin.shell: |
    set -euo pipefail
    /bin/sh -c "{{ admin_stop_script }} {{ applmgr_env_file }}" < /dev/null
  args:
    executable: /bin/bash
  register: admin_stop_out
  no_log: false
  when: target_env + '_app_admin' in group_names

- name: Show stop output
  ansible.builtin.debug:
    var: admin_stop_out.stdout_lines
  when: target_env + '_app_admin' in group_names

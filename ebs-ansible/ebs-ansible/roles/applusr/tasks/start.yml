- name: Start Admin Server
  ansible.builtin.shell: |
    set -euo pipefail
    /bin/sh -c "{{ admin_start_script }} {{ applmgr_env_file }}" < /dev/null
  args:
    executable: /bin/bash
  register: admin_start_out
  no_log: false
  when: target_env + '_app_admin' in group_names

- name: Show start output
  ansible.builtin.debug:
    var: admin_start_out.stdout_lines
  when: target_env + '_app_admin' in group_names

# -------------------------------
# Start EBS services (all app nodes)
# -------------------------------
- name: Start EBS services
  shell: |
    . {{ env_file }}
    {{ app_start_script }}
  register: app_out
  when: target_env + '_app_web_appl' in group_names

- debug:
    var: app_out.stdout
